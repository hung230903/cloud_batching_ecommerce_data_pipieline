[project]
name = "gcloud-glamira-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp[speedups]>=3.13.3",
    "brotli>=1.2.0",
    "db-dtypes>=1.4.4",
    "dbt-bigquery>=1.9.2",
    "dbt-core>=1.11.8",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-storage>=2.4,<3.2",
    "ip2location>=8.11.0",
    "pandas>=2.2.0,<3",
    "plotly>=5.24.0",
    "pyarrow>=17.0.0",
    "pymongo>=4.11.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
