[core]
dags_folder = /opt/airflow/dags
hostname_callable = airflow.utils.net.getfqdn
default_timezone = Asia/Ho_Chi_Minh
executor = LocalExecutor
parallelism = 8
max_active_tasks_per_dag = 4
dags_are_paused_at_creation = true
max_active_runs_per_dag = 1
load_examples = false
plugins_folder = /opt/airflow/plugins
donot_pickle = True
dagbag_import_timeout = 60.0
dag_file_processor_timeout = 120

[database]
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10
sql_alchemy_pool_recycle = 1800

[logging]
base_log_folder = /opt/airflow/logs
logging_level = INFO
log_format = [%(asctime)s] {%(filename)s:%(lineno)d} %(levelname)s - %(message)s
worker_log_server_host = 0.0.0.0
worker_log_server_port = 8793

[webserver]
base_url = http://localhost:8080
default_ui_timezone = Asia/Ho_Chi_Minh
web_server_host = 0.0.0.0
web_server_port = 8080
expose_config = True
dag_default_view = grid
dag_orientation = LR

[scheduler]
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
min_file_process_interval = 30
dag_dir_list_interval = 300
enable_health_check = true
scheduler_health_check_server_port = 8974
catchup_by_default = False
parsing_processes = 2
