name: "glamira_dbt"
version: "1.0.0"

profile: "glamira_dbt"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  project_id: "{{ env_var('BQ_PROJECT_ID') }}"
  raw_dataset: "{{ env_var('BQ_DATASET_ID', 'glamira_raw_layer') }}"

models:
  glamira_dbt:
    staging:
      +schema: glamira_staging
      +materialized: view
      +tags: ["staging"]
    intermediate:
      +schema: glamira_intermediate
      +materialized: table
      +tags: ["intermediate"]
    mart:
      +schema: glamira_mart
      +materialized: table
      +tags: ["mart"]
