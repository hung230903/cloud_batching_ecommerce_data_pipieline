version: 2

models:
  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - not_null
      - name: year_number
        tests:
          - not_null

  - name: dim_currency
    columns:
      - name: currency_code
        tests:
          - unique
          - not_null

  - name: dim_location
    columns:
      - name: location_id
        tests:
          - unique
          - not_null

  - name: dim_store
    columns:
      - name: store_id
        tests:
          - unique
          - not_null

  - name: dim_customer
    columns:
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: dim_product
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
        tests:
          - not_null

  - name: dim_colour
    columns:
      - name: colour_id
        tests:
          - unique
          - not_null

  - name: dim_metal
    columns:
      - name: metal_id
        tests:
          - unique
          - not_null

  - name: dim_stone
    columns:
      - name: stone_id
        tests:
          - unique
          - not_null

  - name: fact_sales_order
    columns:
      - name: sale_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_id
      - name: location_id
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: store_id
        tests:
          - relationships:
              to: ref('dim_store')
              field: store_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
              config:
                severity: warn
      - name: stone_id
        tests:
          - relationships:
              to: ref('dim_stone')
              field: stone_id
              config:
                severity: warn
      - name: colour_id
        tests:
          - relationships:
              to: ref('dim_colour')
              field: colour_id
              config:
                severity: warn
      - name: metal_id
        tests:
          - relationships:
              to: ref('dim_metal')
              field: metal_id
              config:
                severity: warn
      - name: user_id_db
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
              config:
                severity: warn
      - name: currency
        tests:
          - relationships:
              to: ref('dim_currency')
              field: currency_code
              config:
                severity: warn
      - name: device_category
        tests:
          - accepted_values:
              values: ["Mobile", "Desktop", "Tablet", "Console"]
