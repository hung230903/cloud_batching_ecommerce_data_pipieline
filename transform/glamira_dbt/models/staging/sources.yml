version: 2

sources:
  - name: glamira_raw
    database: "{{ env_var('BQ_PROJECT_ID', var('project_id')) }}"
    schema: "{{ env_var('BQ_DATASET_ID', var('raw_dataset')) }}"
    description: "Raw tables loaded from GCS into BigQuery (glamira_project dataset)"

    tables:
      - name: summary
        description: "Raw event log from Glamira website (all collections: checkout_success, view_product_detail, etc.)"
        columns:
          - name: time_stamp
            description: "Event timestamp (string)"
          - name: ip
            description: "IP address of the user"
          - name: user_id_db
            description: "Logged-in user ID"
          - name: device_id
            description: "Device identifier"
          - name: store_id
            description: "Store code"
          - name: order_id
            description: "Order ID (only present in checkout_success)"
          - name: product_id
            description: "Product ID"
          - name: collection
            description: "Event type / collection name"

      - name: product_info
        description: "Crawled product information including nested stone and colour options"
        columns:
          - name: product_id
            description: "Unique product identifier"
          - name: product_name
          - name: sku
          - name: collection_id
          - name: category_id
          - name: store_id
          - name: gender

      - name: ip2location
        description: "IP to geographic location mapping table"
        columns:
          - name: ip
          - name: country
          - name: region
          - name: city
          - name: latitude
          - name: longitude
